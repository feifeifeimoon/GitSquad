version: 2
updates:
  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      nextjs:
        patterns:
          - next
          - eslint-config-next
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      shadcn-ui:
        patterns:
          - shadcn
          - radix-ui
          - class-variance-authority
          - tailwind-merge
          - tw-animate-css
      tooling:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    # `allow` is a whitelist, so `all` looks redundant here and is not: a gomod
    # job with no `allow` resolves to `dependency-type: direct`, which is how the
    # advisories behind the red govulncheck job went unseen in x/net and x/text.
    allow:
      - dependency-type: all

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
