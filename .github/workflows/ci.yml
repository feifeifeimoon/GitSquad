name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only reads the repository.
permissions:
  contents: read

# A re-pushed PR supersedes the run that is still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Go toolchain used by every Go job, as a floating patch range.
  #
  # This is deliberately NOT `go-version-file: go.mod`. The `go` directive is the
  # *language* floor (1.26.2) that contributors must be able to build with, and
  # that standard library carries advisories (net/http, crypto/tls, crypto/x509,
  # net/url, net/mail, encoding/xml, encoding/asn1) which govulncheck reports as
  # reachable from this code. Only a patched patch release clears them.
  #
  # The wildcard is what keeps that current: every run picks the newest 1.26
  # patch, so a security release lands with no PR, while the minor is pinned so
  # the toolchain cannot drift to 1.27 on its own. An exact pin would rot —
  # Dependabot's github-actions ecosystem only rewrites `uses:` refs, never a
  # string in `env:`. This is the same shape prometheus (`1.27.x`) and caddy
  # (`~1.26`) use.
  GO_TOOLCHAIN: "1.26.x"

  # Minimum total statement coverage for the Go packages. This is a ratchet, not
  # a target: it sits below the current figure so an OS-dependent skip cannot
  # produce a false red. Raise it as handler/store tests land. The largest
  # remaining gaps are internal/server/handler, middleware, store and crypto,
  # which have no test files at all and are visible in the job summary.
  COVERAGE_FLOOR: "12"

jobs:
  backend:
    name: Backend Format, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_TOOLCHAIN }}
          cache: true

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l cmd internal pkg)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted. Run 'make fmt' and commit the result."
            echo "$unformatted"
            exit 1
          fi
          echo "All Go files are gofmt-formatted."

      # `go mod tidy -diff` exits non-zero when go.mod/go.sum need changes, so
      # this catches a hand-edited go.mod or a missing `go mod tidy` before it
      # reaches main. (Note: `go fix -diff` does NOT exit non-zero on a non-empty
      # diff — it would silently pass — so it is intentionally not used here.)
      - name: Check module tidiness
        run: go mod tidy -diff

      - name: Vet
        run: go vet $(go list ./... | grep -v '/web/')

      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          # Pinned on purpose: new Staticcheck releases introduce new checks, so
          # this should move in a reviewable commit rather than silently.
          version: "2026.2.1"
          # Go is already installed by the step above.
          install-go: false

      - name: Test with coverage
        run: |
          set -euo pipefail
          go test -race -count=1 -covermode=atomic -coverprofile=coverage.out \
            $(go list ./... | grep -v '/web/')

      - name: Enforce coverage floor
        run: |
          set -euo pipefail
          go tool cover -func=coverage.out > coverage.txt

          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
          echo "### Go statement coverage: ${total}%" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if ! awk "BEGIN { exit !($total >= $COVERAGE_FLOOR) }"; then
            echo "::error::Total coverage ${total}% is below the ${COVERAGE_FLOOR}% floor. Add tests or lower COVERAGE_FLOOR deliberately."
            exit 1
          fi

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 14

      - name: Build
        run: go build $(go list ./... | grep -v '/web/')

  vulncheck:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-input: ${{ env.GO_TOOLCHAIN }}
          go-package: ./...
          repo-checkout: "false"

  web:
    name: Web Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # bun is the only package manager for web/. There is no package-lock.json
      # on purpose — see CONTRIBUTING.md.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gitsquad
          POSTGRES_USER: gitsquad
          POSTGRES_PASSWORD: gitsquad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gitsquad -d gitsquad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GITSQUAD_DATABASE_URL: postgres://gitsquad:gitsquad@localhost:5432/gitsquad?sslmode=disable
      GITSQUAD_E2E: "true"
      GITSQUAD_GOOGLE_CLIENT_ID: e2e-client-id
      GITSQUAD_GOOGLE_CLIENT_SECRET: e2e-client-secret
      GITSQUAD_JWT_SECRET: e2e-jwt-secret
      E2E_API_URL: http://localhost:8080
      E2E_FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_TOOLCHAIN }}
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Run E2E suite
        run: bash scripts/e2e.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
