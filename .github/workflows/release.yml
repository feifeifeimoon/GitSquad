name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goreleaser-release
  cancel-in-progress: false

# Go toolchain, kept in sync with .github/workflows/ci.yml. The `go` directive in
# go.mod is the language floor (1.26.2), whose standard library carries
# advisories that would otherwise ship inside the released binaries, so this
# floats to the newest 1.26 patch rather than tracking that floor.
env:
  GO_TOOLCHAIN: "1.26.x"

jobs:
  test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_TOOLCHAIN }}
          cache: true

      - name: Test
        run: go test -v -race $(go list ./... | grep -v '/web/')

  release:
    name: Release with GoReleaser
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_TOOLCHAIN }}
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
